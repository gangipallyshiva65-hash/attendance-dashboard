<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brazeforce Attendance</title>
<style>
  :root {
    --bg: #f4f5f8;
    --card: #ffffff;
    --ink: #151a23;
    --muted: #5b6472;
    --line: #e2e5ea;
    --accent: #2457e6;
    --accent-ink: #ffffff;
    --accent-soft: #e8eefd;
    --green: #12703c;   --green-soft: #def4e7;
    --violet: #5b36b8;  --violet-soft: #ece6fa;
    --slate: #4b5563;   --slate-soft: #eceef2;
    --amber: #8a5300;   --amber-soft: #fdf0d2;
    --red: #c0182b;     --red-soft: #fde6e8;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --card: #181c25; --ink: #eceff4; --muted: #9aa4b4; --line: #2a303c;
      --accent: #6f93ff; --accent-ink: #0b1020; --accent-soft: #1d2740;
      --green: #5fd391; --green-soft: #12301f;
      --violet: #b79cff; --violet-soft: #2a2145;
      --slate: #b4bcc9; --slate-soft: #252a35;
      --amber: #f2b84b; --amber-soft: #3a2c0d;
      --red: #ff7a87; --red-soft: #3d1419;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 48px; }

  /* header */
  header { padding: 20px 0 8px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 11px; background: var(--accent); color: var(--accent-ink);
          display: grid; place-items: center; font-weight: 800; font-size: 20px; }
  .brand h1 { font-size: 18px; line-height: 1.2; margin: 0; }
  .brand p { margin: 0; color: var(--muted); font-size: 13px; }
  .seg { display: inline-flex; padding: 4px; background: var(--slate-soft); border-radius: 12px; gap: 4px; }
  .seg button { border: 0; background: transparent; padding: 8px 18px; border-radius: 9px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .seg button:focus-visible, .btn:focus-visible, .chip:focus-visible, .link:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* generic */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-top: 16px; box-shadow: var(--shadow); }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .btn { border: 1px solid var(--line); background: var(--card); padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; }
  .btn:hover:not(:disabled) { background: var(--slate-soft); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.danger { color: var(--red); }
  .link { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; text-align: left; }
  .link:hover { text-decoration: underline; }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .b-present { color: var(--green); background: var(--green-soft); }
  .b-leave   { color: var(--violet); background: var(--violet-soft); }
  .b-absent, .b-pending, .b-upcoming { color: var(--slate); background: var(--slate-soft); }
  .b-over    { color: var(--red); background: var(--red-soft); }
  .b-low     { color: var(--amber); background: var(--amber-soft); }
  .b-ok      { color: var(--muted); background: transparent; padding-left: 0; }
  .b-ok::before { display: none; }

  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }

  /* user view */
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .chip { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--card); padding: 10px 12px; border-radius: 12px; cursor: pointer; text-align: left; }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
  .chip .nm { font-weight: 600; }
  .me-head { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  .me-head .avatar { width: 48px; height: 48px; font-size: 16px; }
  .me-head h2 { margin: 0; font-size: 20px; }
  .me-head .grow { flex: 1; min-width: 160px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
  .actions .btn { padding: 14px 22px; font-size: 16px; flex: 1 1 200px; }
  .meter { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; }
  .pips { display: flex; gap: 5px; }
  .pip { width: 22px; height: 10px; border-radius: 4px; background: var(--slate-soft); border: 1px solid var(--line); }
  .pip.on { background: var(--accent); border-color: var(--accent); }
  .meter.low .pip.on { background: #d99a1e; border-color: #d99a1e; }
  .meter.over .pip.on { background: var(--red); border-color: var(--red); }
  .notice { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-weight: 600; }
  .notice.over { background: var(--red-soft); color: var(--red); }
  .notice.low { background: var(--amber-soft); color: var(--amber); }
  .hist { list-style: none; margin: 0; padding: 0; }
  .hist li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
  .hist li:first-child { border-top: 0; }

  /* admin view */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
  .stat .n { font-size: 28px; font-weight: 800; line-height: 1.1; }
  .stat .l { color: var(--muted); font-size: 13px; }
  .stat.alert { border-color: var(--red); background: var(--red-soft); }
  .stat.alert .n, .stat.alert .l { color: var(--red); }
  .banner { margin-top: 16px; padding: 12px 16px; border-radius: 12px; background: var(--red-soft); color: var(--red); font-weight: 600; border: 1px solid var(--red); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .toolbar .grow { flex: 1; }
  .toolbar label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  input[type="date"], input[type="search"], input[type="text"], select {
    border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 10px; min-height: 40px;
  }
  input[type="search"], input[type="text"] { min-width: 200px; }
  .tablewrap { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
  table { width: 100%; border-collapse: collapse; min-width: 680px; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.over td { background: var(--red-soft); }
  tr.over td:first-child { box-shadow: 4px 0 0 var(--red) inset; }
  .who { display: flex; align-items: center; gap: 10px; }
  .reddot { width: 18px; height: 18px; border-radius: 50%; background: var(--red); color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; flex: none; }
  .num { font-variant-numeric: tabular-nums; font-weight: 700; }
  .detail td { background: var(--bg); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .tag { background: var(--violet-soft); color: var(--violet); padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
  .empty { text-align: center; padding: 28px; color: var(--muted); }
  .addform { display: flex; flex-wrap: wrap; gap: 10px; }
  .foot { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg);
           padding: 10px 18px; border-radius: 10px; font-weight: 600; opacity: 0; pointer-events: none; transition: .2s; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">B</div>
      <div>
        <h1>Brazeforce Office</h1>
        <p>Attendance &amp; leave dashboard</p>
      </div>
    </div>
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-role="user" aria-pressed="true">User</button>
      <button type="button" data-role="admin" aria-pressed="false">Admin</button>
    </div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const LIMIT = 10;                       // leaves per employee per year
  const KEY = 'brazeforce-attendance-v1'; // localStorage key
  const DEMO_NAMES = ['Arjun Mehta','Priya Nair','Rahul Verma','Sneha Kapoor','Karthik Rao','Ananya Iyer','Vikram Singh','Divya Reddy'];

  /* ---------- helpers ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const todayISO = () => iso(new Date());
  const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const longDate = s => parse(s).toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const shortDate = s => parse(s).toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });
  const initials = n => n.trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join('');
  const year = () => new Date().getFullYear();

  /* ---------- data ---------- */
  function seed() {
    const employees = DEMO_NAMES.map((name, i) => ({ id: 'e' + (i+1), name }));
    const records = {};
    const t = todayISO(), y = year();
    const days = [];
    for (let d = new Date(y, 0, 1); iso(d) < t; d.setDate(d.getDate() + 1)) {
      if (d.getDay() !== 0 && d.getDay() !== 6) days.push(iso(d));
    }
    let s = 42;
    const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
    const plan = [10, 3, 8, 0, 5, 9, 1, 6];   // leaves already used, per employee (demo)
    employees.forEach((e, i) => {
      const pool = days.slice();
      const leaves = new Set();
      for (let k = 0; k < Math.min(plan[i], pool.length); k++) {
        leaves.add(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
      }
      days.forEach(day => {
        (records[day] = records[day] || {});
        if (leaves.has(day)) records[day][e.id] = 'leave';
        else if (rnd() > 0.04) records[day][e.id] = 'present';   // ~4% absent
      });
    });
    records[t] = { e2: 'present', e3: 'present', e5: 'present' };
    return { employees, records };
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && Array.isArray(d.employees) && d.records) return d;
    } catch (e) {}
    return seed();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }

  let db = load();
  const ui = { role: 'user', empId: null, date: todayISO(), search: '', filter: 'all', openId: null };

  const leaveDates = id => Object.keys(db.records)
    .filter(d => d.startsWith(year() + '-') && db.records[d][id] === 'leave').sort();
  const leaveInfo = id => {
    const used = leaveDates(id).length;
    const left = Math.max(0, LIMIT - used);
    return { used, left, over: used >= LIMIT, low: used < LIMIT && left <= 2 };
  };
  function statusOn(id, d) {
    const r = db.records[d] && db.records[d][id];
    if (r) return r;
    const t = todayISO();
    return d > t ? 'upcoming' : d === t ? 'pending' : 'absent';
  }
  const STATUS_LABEL = { present:'Present', leave:'On leave', absent:'Absent', pending:'Not marked yet', upcoming:'—' };
  const badge = st => `<span class="badge b-${st}">${STATUS_LABEL[st]}</span>`;
  function setStatus(id, d, st) {
    (db.records[d] = db.records[d] || {})[id] = st;
    save();
  }
  function pips(used) {
    let h = '';
    for (let i = 0; i < LIMIT; i++) h += `<span class="pip${i < used ? ' on' : ''}"></span>`;
    return `<span class="pips" aria-hidden="true">${h}</span>`;
  }

  /* ---------- toast ---------- */
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  /* ---------- USER view ---------- */
  function renderUser() {
    const emp = db.employees.find(e => e.id === ui.empId);
    let html = `<section class="card"><h2>Select your name</h2><div class="chips">` +
      db.employees.map(e => `
        <button type="button" class="chip" data-action="pick" data-id="${esc(e.id)}" aria-pressed="${e.id === ui.empId}">
          <span class="avatar">${esc(initials(e.name))}</span><span class="nm">${esc(e.name)}</span>
        </button>`).join('') + `</div></section>`;

    if (!emp) {
      html += `<section class="card empty">Pick your name above to mark today's attendance.</section>`;
      return html;
    }
    const t = todayISO();
    const st = statusOn(emp.id, t);
    const info = leaveInfo(emp.id);
    const cls = info.over ? 'over' : info.low ? 'low' : '';
    const canLeave = st === 'leave' || !info.over;

    html += `
    <section class="card">
      <div class="me-head">
        <span class="avatar">${esc(initials(emp.name))}</span>
        <div class="grow"><h2>${esc(emp.name)}</h2><div class="muted">${esc(longDate(t))}</div></div>
        <div>Today: ${badge(st)}</div>
      </div>
      <div class="actions">
        <button type="button" class="btn primary" data-action="mark" data-status="present" ${st === 'present' ? 'disabled' : ''}>
          ${st === 'present' ? '✓ Marked present' : 'Mark present'}
        </button>
        <button type="button" class="btn" data-action="mark" data-status="leave" ${st === 'leave' || !canLeave ? 'disabled' : ''}>
          ${st === 'leave' ? 'On leave today' : 'Apply leave for today'}
        </button>
      </div>
      <div class="meter ${cls}">
        ${pips(info.used)}
        <span><strong class="num">${info.left}</strong> of ${LIMIT} leaves left in ${year()} <span class="muted">(${info.used} used)</span></span>
      </div>
      ${info.over ? `<div class="notice over">All ${LIMIT} leaves for ${year()} are used. You can't apply more leave — please talk to your admin.</div>` : ''}
      ${info.low ? `<div class="notice low">Only ${info.left} leave${info.left === 1 ? '' : 's'} remaining this year.</div>` : ''}
    </section>`;

    const days = Object.keys(db.records).filter(d => db.records[d][emp.id]).sort().reverse().slice(0, 8);
    html += `<section class="card"><h2>My recent attendance</h2>` + (days.length
      ? `<ul class="hist">${days.map(d => `<li><span>${esc(shortDate(d))}</span>${badge(db.records[d][emp.id])}</li>`).join('')}</ul>`
      : `<div class="muted">Nothing recorded yet.</div>`) + `</section>`;
    return html;
  }

  /* ---------- ADMIN view ---------- */
  function renderAdmin() {
    const d = ui.date;
    const rows = db.employees.map(e => ({ e, st: statusOn(e.id, d), info: leaveInfo(e.id) }));
    const present = rows.filter(r => r.st === 'present').length;
    const onLeave = rows.filter(r => r.st === 'leave').length;
    const notPresent = rows.length - present - onLeave;
    const over = rows.filter(r => r.info.over);

    return `
    ${over.length ? `<div class="banner" role="alert">⚠ Leaves finished (${LIMIT}/${LIMIT}): ${over.map(r => esc(r.e.name)).join(', ')}</div>` : ''}
    <div class="stats">
      <div class="stat"><div class="n">${rows.length}</div><div class="l">Employees</div></div>
      <div class="stat"><div class="n" style="color:var(--green)">${present}</div><div class="l">Present</div></div>
      <div class="stat"><div class="n" style="color:var(--violet)">${onLeave}</div><div class="l">On leave</div></div>
      <div class="stat"><div class="n">${notPresent}</div><div class="l">${d === todayISO() ? 'Not marked / absent' : 'Absent'}</div></div>
      <div class="stat ${over.length ? 'alert' : ''}"><div class="n">${over.length}</div><div class="l">Leaves over</div></div>
    </div>

    <section class="card">
      <div class="toolbar">
        <label>Date <input type="date" id="dateIn" value="${esc(d)}"></label>
        <button type="button" class="btn" data-action="today">Today</button>
        <span class="grow"></span>
        <input type="search" id="searchIn" placeholder="Search employee" aria-label="Search employee" value="${esc(ui.search)}">
        <select id="filterIn" aria-label="Filter">
          ${[['all','All employees'],['present','Present'],['leave','On leave'],['absent','Not present'],['over','Leaves over']]
            .map(([v,l]) => `<option value="${v}" ${ui.filter === v ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="muted small" style="margin-bottom:10px">${esc(longDate(d))} · leave balance is for ${year()} (${LIMIT} per person)</div>
      <div class="tablewrap" id="tbl">${tableHTML()}</div>
    </section>

    <section class="card">
      <h2>Add employee</h2>
      <form class="addform" id="addForm">
        <input type="text" id="newName" placeholder="Full name" aria-label="New employee name" maxlength="60" required>
        <button class="btn primary" type="submit">Add</button>
      </form>
    </section>

    <div class="foot">
      <span>Data is saved in this browser only.</span>
      <button type="button" class="btn" data-action="reset">Reset demo data</button>
    </div>`;
  }

  function tableHTML() {
    const d = ui.date, q = ui.search.trim().toLowerCase();
    const rows = db.employees
      .map(e => ({ e, st: statusOn(e.id, d), info: leaveInfo(e.id) }))
      .filter(r => !q || r.e.name.toLowerCase().includes(q))
      .filter(r => ui.filter === 'all' ? true
        : ui.filter === 'over' ? r.info.over
        : ui.filter === 'absent' ? !['present','leave'].includes(r.st)
        : r.st === ui.filter);
    if (!rows.length) return `<div class="empty">No employees match.</div>`;

    return `<table>
      <thead><tr><th>Employee</th><th>Attendance</th><th>Leaves used</th><th>Remaining</th><th>Alert</th></tr></thead>
      <tbody>` + rows.map(({ e, st, info }) => {
        const alert = info.over ? `<span class="badge b-over">Leaves over</span>`
                    : info.low ? `<span class="badge b-low">Almost over</span>`
                    : `<span class="badge b-ok">OK</span>`;
        const open = ui.openId === e.id;
        const dates = leaveDates(e.id);
        return `<tr class="${info.over ? 'over' : ''}">
          <td><div class="who">
            ${info.over ? `<span class="reddot" title="Leaves finished" aria-hidden="true">!</span>` : `<span class="avatar">${esc(initials(e.name))}</span>`}
            <button type="button" class="link" data-action="toggle" data-id="${esc(e.id)}" aria-expanded="${open}">${esc(e.name)}</button>
          </div></td>
          <td>${badge(st)}</td>
          <td><div class="meter ${info.over ? 'over' : info.low ? 'low' : ''}">${pips(info.used)}<span class="num">${info.used}/${LIMIT}</span></div></td>
          <td class="num" ${info.over ? 'style="color:var(--red)"' : ''}>${info.left}</td>
          <td>${alert}</td>
        </tr>` + (open ? `<tr class="detail"><td colspan="5">
          <div class="small muted">Leave days taken in ${year()}:</div>
          <div class="tags">${dates.length ? dates.map(x => `<span class="tag">${esc(shortDate(x))}</span>`).join('') : '<span class="muted small">None</span>'}</div>
          <button type="button" class="btn danger" data-action="remove" data-id="${esc(e.id)}">Remove employee</button>
        </td></tr>` : '');
      }).join('') + `</tbody></table>`;
  }

  /* ---------- render + events ---------- */
  const app = document.getElementById('app');
  function render() {
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.role === ui.role));
    app.innerHTML = ui.role === 'user' ? renderUser() : renderAdmin();
  }
  const refreshTable = () => { const el = document.getElementById('tbl'); if (el) el.innerHTML = tableHTML(); };

  document.querySelector('.seg').addEventListener('click', e => {
    const b = e.target.closest('button[data-role]');
    if (b) { ui.role = b.dataset.role; render(); }
  });

  app.addEventListener('click', e => {
    const b = e.target.closest('[data-action]');
    if (!b) return;
    const a = b.dataset.action, id = b.dataset.id;
    if (a === 'pick') { ui.empId = id; render(); }
    else if (a === 'mark') {
      const emp = db.employees.find(x => x.id === ui.empId); if (!emp) return;
      const st = b.dataset.status;
      if (st === 'leave' && leaveInfo(emp.id).over) { toast('No leaves left this year'); return; }
      setStatus(emp.id, todayISO(), st);
      render();
      toast(st === 'present' ? 'Marked present for today ✓' : 'Leave applied for today');
    }
    else if (a === 'today') { ui.date = todayISO(); render(); }
    else if (a === 'toggle') { ui.openId = ui.openId === id ? null : id; refreshTable(); }
    else if (a === 'remove') {
      const emp = db.employees.find(x => x.id === id);
      if (emp && confirm(`Remove ${emp.name} and all their attendance records?`)) {
        db.employees = db.employees.filter(x => x.id !== id);
        Object.values(db.records).forEach(r => delete r[id]);
        if (ui.empId === id) ui.empId = null;
        ui.openId = null; save(); render(); toast('Employee removed');
      }
    }
    else if (a === 'reset') {
      if (confirm('Reset everything to the demo data? This clears all current records.')) {
        db = seed(); save(); ui.empId = null; ui.openId = null; render(); toast('Demo data restored');
      }
    }
  });

  app.addEventListener('input', e => {
    if (e.target.id === 'searchIn') { ui.search = e.target.value; refreshTable(); }
  });
  app.addEventListener('change', e => {
    if (e.target.id === 'dateIn' && e.target.value) { ui.date = e.target.value; render(); }
    if (e.target.id === 'filterIn') { ui.filter = e.target.value; refreshTable(); }
  });
  app.addEventListener('submit', e => {
    if (e.target.id !== 'addForm') return;
    e.preventDefault();
    const name = document.getElementById('newName').value.trim().replace(/\s+/g, ' ');
    if (!name) return;
    if (db.employees.some(x => x.name.toLowerCase() === name.toLowerCase())) { toast('That name already exists'); return; }
    db.employees.push({ id: 'e' + Date.now().toString(36), name });
    save(); render(); toast(`${name} added`);
  });

  render();
})();
</script>
</body>
</html>
